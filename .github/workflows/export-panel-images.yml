name: Export panel images for reels
on:
  push:
    paths:
      - '.github/workflows/export-panel-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --prefix website-tests
      - run: npx playwright install --with-deps chromium
        working-directory: website-tests
      - name: Render all 80 panels at double resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('website-tests/materials.mjs')
          s=p.read_text()
          assert 'viewport:{width:480,height:480}' in s
          p.write_text(s.replace('viewport:{width:480,height:480}', 'viewport:{width:480,height:480},deviceScaleFactor:2'))
          PY
          node website-tests/materials.mjs
          git restore website-tests/materials.mjs
      - name: Package PNG images
        run: |
          mkdir -p marketing/panel-images
          cp material-captures/*.png marketing/panel-images/
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          images=sorted(Path('marketing/panel-images').glob('*.png'))
          assert len(images)==80
          with ZipFile('marketing/aurelvi-panel-images.zip','w',ZIP_DEFLATED) as z:
              for p in images:
                  z.write(p, 'aurelvi-panel-images/'+p.name)
          Path('marketing/README.md').write_text('# Aurelvi panel images\n\n80 PNG screenshots of the actual Aurelvi demo interface, rendered at 960 × 960 pixels. English labels. These are screen images without a physical device frame.\n\n[Download all 80 images as ZIP](https://github.com/sonics007/aurelvi-ha/raw/refs/heads/main/marketing/aurelvi-panel-images.zip)\n\n[Browse individual PNG images](panel-images/)\n')
          PY
      - name: Save images to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/panel-images marketing/aurelvi-panel-images.zip marketing/README.md
          if ! git diff --cached --quiet; then
            git commit -m "Add 80 downloadable panel PNG images and reel ZIP"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
