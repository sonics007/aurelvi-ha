name: Publish versioned release
on:
  push:
    branches: [main]
    paths: ["custom_components/aurelvi/**", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: versioned-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package integration with stable folder name
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('custom_components')
          with zipfile.ZipFile('aurelvi.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted((root / 'aurelvi').rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          PY
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('custom_components/aurelvi/manifest.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid version');
            const {owner, repo} = context.repo;
            const tag = 'v' + version;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: 'Aurelvi Home Assistant ' + version,
                body: 'Manual installation: extract aurelvi.zip and copy the aurelvi folder into /config/custom_components/. Restart Home Assistant. The folder name remains aurelvi for every version.',
                draft: true, prerelease: false
              })).data;
            }
            if (!release.assets.some(a => a.name === 'aurelvi.zip')) {
              const data = fs.readFileSync('aurelvi.zip');
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: 'aurelvi.zip', data, headers: {'content-type': 'application/zip', 'content-length': data.length}});
            }
            if (release.draft) await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, make_latest: 'true'});
