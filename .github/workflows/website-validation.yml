name: Validate Aurelvi website and licensing
on:
  push:
    paths:
      - 'website/**'
      - 'licensing-server/**'
      - '.github/workflows/website-validation.yml'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser script syntax
        run: node --check website/assets/site.js
      - name: Licence signatures and payment entitlement
        run: node --test licensing-server/worker.test.mjs
      - name: Public site safety defaults
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config=JSON.parse(fs.readFileSync('website/assets/commerce.json','utf8'));
          assert.equal(config.enabled,false);
          assert.equal(config.nativeActivationReady,false);
          assert.equal(config.apiBase,'');
          for(const page of ['index','features','gallery','setup','pricing','activate'])assert(fs.readFileSync('website/'+page+'.html','utf8').includes('assets/site.js'));
          console.log('All six pages exist; commerce stays disabled.');
          JS
